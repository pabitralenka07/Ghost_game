<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ghost Hunt - Interactive SVG Game</title>
    <!-- Snap.svg & RxJS 5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/snap.svg/0.4.1/snap.svg-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/rxjs/5.0.1/Rx.min.js"></script>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;600;800;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0f17;
            --accent-cyan: #69fff1;
            --accent-electric: #507dbc;
            --accent-pink: #ff6978;
            --accent-yellow: #ffd166;
            --text-main: #f0f4f8;
            --text-muted: #8292a2;
            --panel-bg: rgba(18, 24, 38, 0.75);
            --panel-border: rgba(105, 255, 241, 0.25);
            --glow-color: rgba(105, 255, 241, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(30, 41, 67, 0.5) 0%, transparent 70%),
                radial-gradient(circle at 20% 90%, rgba(15, 82, 87, 0.25) 0%, transparent 50%),
                linear-gradient(to bottom, #090c13 0%, #0c0f17 100%);
            font-family: 'Catamaran', sans-serif;
            color: var(--text-main);
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        svg#svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: crosshair;
            -webkit-backface-visibility: hidden;
        }

        /* Ambient Cyber Grid Background Overlay */
        .ambient-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            pointer-events: none;
            z-index: 1;
        }

        /* Glassmorphism Top HUD */
        .hud-top {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 24px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 16px var(--glow-color);
            z-index: 50;
            pointer-events: auto;
            max-width: 90vw;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            font-size: 1.5rem;
            filter: drop-shadow(0 0 8px var(--accent-pink));
            animation: ghostFloat 3s ease-in-out infinite;
        }

        .brand-title {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 1.15rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 20%, var(--accent-cyan) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .hud-stats {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2px 10px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
        }

        .stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #8292a2;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8292a2;
            transition: all 0.3s ease;
        }

        .status-indicator.ready .status-dot {
            background: #38ef7d;
            box-shadow: 0 0 8px #38ef7d;
        }

        .status-indicator.firing .status-dot {
            background: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan);
            animation: pulseDot 0.8s infinite;
        }

        .status-indicator.locked .status-dot {
            background: var(--accent-pink);
            box-shadow: 0 0 14px var(--accent-pink);
            animation: pulseDot 0.4s infinite;
        }

        .hud-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            background: rgba(105, 255, 241, 0.2);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            transform: scale(1.08);
            box-shadow: 0 0 10px rgba(105, 255, 241, 0.4);
        }

        /* Bottom Controls Helper Overlay */
        .controls-overlay {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 18px;
            background: rgba(12, 16, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            z-index: 50;
            pointer-events: none;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: opacity 0.5s ease;
        }

        .key-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 7px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: #ffffff;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            margin: 0 2px;
        }

        @keyframes ghostFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        @media (max-width: 650px) {
            .hud-top {
                gap: 10px;
                padding: 6px 14px;
            }
            .brand-title {
                font-size: 0.95rem;
                letter-spacing: 1px;
            }
            .stat-badge {
                padding: 1px 6px;
            }
            .stat-value {
                font-size: 0.8rem;
            }
            .controls-overlay {
                font-size: 0.7rem;
                padding: 6px 12px;
                bottom: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Background Ambient Grid -->
        <div class="ambient-grid"></div>

        <!-- Interactive HUD -->
        <header class="hud-top">
            <div class="brand">
                <span class="brand-icon">👻</span>
                <span class="brand-title">Ghost Hunt</span>
            </div>

            <div class="hud-stats">
                <div class="stat-badge">
                    <span class="stat-label">Ghosts</span>
                    <span class="stat-value" id="ghost-count">5</span>
                </div>
                <div class="stat-badge">
                    <span class="stat-label">Captured</span>
                    <span class="stat-value" id="captured-count">0</span>
                </div>
            </div>

            <div class="status-indicator ready" id="status-badge">
                <div class="status-dot"></div>
                <span id="status-text">SYSTEM READY</span>
            </div>

            <div class="hud-actions">
                <button class="hud-btn" id="btn-sound" title="Toggle Sound">🔊</button>
                <button class="hud-btn" id="btn-add-ghost" title="Add Ghost">➕</button>
            </div>
        </header>

        <!-- SVG Game Canvas -->
        <svg id="svg"></svg>

        <!-- Controls Guide -->
        <footer class="controls-overlay" id="controls-hint">
            <span>Move: <span class="key-badge">A</span><span class="key-badge">D</span> or <span class="key-badge">←</span><span class="key-badge">→</span></span>
            <span>•</span>
            <span>Fire Proton Stream: <strong>Click &amp; Hold Mouse / Tap Screen</strong></span>
        </footer>
    </div>

    <script>
        'use strict';

        // Sound Synthesizer (Web Audio API)
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
                this.beamOsc = null;
                this.beamGain = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            startBeam() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                if (!this.beamOsc) {
                    this.beamOsc = this.ctx.createOscillator();
                    this.beamGain = this.ctx.createGain();

                    this.beamOsc.type = 'sawtooth';
                    this.beamOsc.frequency.setValueAtTime(95, this.ctx.currentTime);

                    // Low-pass filter for electric hum
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(450, this.ctx.currentTime);

                    this.beamGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                    this.beamGain.gain.exponentialRampToValueAtTime(0.08, this.ctx.currentTime + 0.1);

                    this.beamOsc.connect(filter);
                    filter.connect(this.beamGain);
                    this.beamGain.connect(this.ctx.destination);
                    this.beamOsc.start();
                }
            }

            stopBeam() {
                if (this.beamOsc) {
                    try {
                        this.beamGain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.15);
                        setTimeout(() => {
                            if (this.beamOsc) {
                                this.beamOsc.stop();
                                this.beamOsc.disconnect();
                                this.beamOsc = null;
                            }
                        }, 160);
                    } catch (e) {
                        this.beamOsc = null;
                    }
                }
            }

            zap() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'square';
                osc.frequency.setValueAtTime(260 + Math.random() * 240, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.13);
            }
        }

        const soundFX = new SoundFX();

        // Utilities
        class U {}
        U.randomFromRange = (min, max) =>
            Math.floor(Math.random() * (max - min + 1) + min);

        U.colors = [
            '#0F5257',
            '#FF6978',
            '#A7FFF6',
            '#507DBC',
            '#98DFEA',
            '#69FFF1',
            '#EEEEEE',
            '#FFFFFF',
            '#FFD166',
            '#06D6A0'
        ];

        U.translate = (x = 0, y = 0) => `translate(${x}, ${y})`;
        U.within = (min, target, max) => Math.min(Math.max(min, target), max);

        U.mouseEventToCoordinate = (mouseEvent) => ({
            x: mouseEvent.clientX,
            y: mouseEvent.clientY,
        });

        U.touchEventToCoordinate = (touchEvent) => ({
            x: touchEvent.changedTouches[0].clientX,
            y: touchEvent.changedTouches[0].clientY,
        });

        U.createPath = (points, offset = { x: 0, y: 0 }, percentageContainer) => {
            let path = '';
            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                path += p.type ? p.type : i == 0 ? '' : ', ';
                if (percentageContainer)
                    path +=
                        offset.x +
                        (p.x / 100) * percentageContainer.width +
                        ' ' +
                        (offset.y + (p.y / 100) * percentageContainer.height);
                else path += offset.x + p.x + ' ' + (offset.y + p.y);
            }
            return path;
        };

        // Game Core
        class Game {
            constructor() {
                this.GAME_LENGTH_SECONDS = 1000;
                this.PLAYER_SPEED = 14;
                this.PLAYER_SPEED_STEP = 1.2;
                this.width = 0;
                this.height = 0;
                this.ghosts = [];
                this.stagePadding = 30;
                this.started = false;
                this.playerCurrentSpeed = 0;
                this.playerTargetSpeed = 0;
                this.capturedTotal = 0;
                this.previouslyHitGhost = null;

                this.goLeft = () => this.setPlayerDirection(-this.PLAYER_SPEED, true);
                this.stopLeft = () => this.setPlayerDirection(-this.PLAYER_SPEED);
                this.goRight = () => this.setPlayerDirection(this.PLAYER_SPEED, true);
                this.stopRight = () => this.setPlayerDirection(this.PLAYER_SPEED);

                this.container = document.getElementById('container');
                this.stage = Snap('#svg');
                this.player = new Player(this.stage);
                this.onResize();

                let pad = this.stagePadding * 2;
                for (let i = 0; i < 5; i++) {
                    this.addGhost();
                }

                this.resize = Rx.Observable.fromEvent(window, 'resize');
                this.resize.subscribe(() => this.onResize());

                // Keyboard input stream
                let keyDowns = Rx.Observable.fromEvent(document, 'keydown');
                let keyUps = Rx.Observable.fromEvent(document, 'keyup');
                this.keyPress = keyDowns
                    .merge(keyUps)
                    .filter((e) =>
                        ['arrowright', 'arrowleft', 'a', 'd'].indexOf(
                            e.key.toLowerCase()
                        ) >= 0
                    )
                    .groupBy((e) => e.keyCode)
                    .map((group) => group.distinctUntilChanged(null, (e) => e.type))
                    .mergeAll();

                // Mouse and touch input streams
                let mouseDowns = Rx.Observable.fromEvent(document, 'mousedown').map(
                    U.mouseEventToCoordinate
                );
                let mouseMoves = Rx.Observable.fromEvent(window, 'mousemove').map(
                    U.mouseEventToCoordinate
                );
                let mouseUps = Rx.Observable.fromEvent(window, 'mouseup').map(
                    U.mouseEventToCoordinate
                );
                let touchStarts = Rx.Observable.fromEvent(document, 'touchstart').map(
                    U.touchEventToCoordinate
                );
                let touchMoves = Rx.Observable.fromEvent(document, 'touchmove').map(
                    U.touchEventToCoordinate
                );
                let touchEnds = Rx.Observable.fromEvent(window, 'touchend').map(
                    U.touchEventToCoordinate
                );

                this.mouseDown = mouseDowns.merge(touchStarts);
                this.mouseMove = mouseMoves.merge(touchMoves);
                this.mouseUp = mouseUps.merge(touchEnds);

                this.initUI();
            }

            addGhost() {
                let pad = this.stagePadding * 2;
                const newGhost = new Ghost(
                    this.stage,
                    this.stagePadding + Math.round(Math.random() * (this.width - pad)),
                    this.stagePadding + Math.round(Math.random() * (this.height * 0.65 - pad))
                );
                this.ghosts.push(newGhost);
                this.updateGhostCount();
            }

            updateGhostCount() {
                const el = document.getElementById('ghost-count');
                if (el) el.textContent = this.ghosts.length;
            }

            updateCapturedCount() {
                const el = document.getElementById('captured-count');
                if (el) el.textContent = this.capturedTotal;
            }

            setStatus(state, text) {
                const badge = document.getElementById('status-badge');
                const label = document.getElementById('status-text');
                if (badge && label) {
                    badge.className = `status-indicator ${state}`;
                    label.textContent = text;
                }
            }

            initUI() {
                const btnSound = document.getElementById('btn-sound');
                if (btnSound) {
                    btnSound.addEventListener('click', () => {
                        soundFX.enabled = !soundFX.enabled;
                        btnSound.textContent = soundFX.enabled ? '🔊' : '🔇';
                        btnSound.title = soundFX.enabled ? 'Mute Sound' : 'Enable Sound';
                    });
                }

                const btnAdd = document.getElementById('btn-add-ghost');
                if (btnAdd) {
                    btnAdd.addEventListener('click', () => {
                        this.addGhost();
                    });
                }
            }

            onResize() {
                this.width = this.container.offsetWidth;
                this.height = this.container.offsetHeight;
                this.stage.attr({
                    width: this.width,
                    height: this.height,
                });
                this.player.setY(this.height);
            }

            start() {
                this.player.setX((this.width - this.player.width) / 2);

                this.keyPressSubscription = this.keyPress.subscribe((e) => {
                    let type = e.type === 'keydown' ? 'go' : 'stop';
                    if (['arrowleft', 'a'].indexOf(e.key.toLowerCase()) >= 0) {
                        this[type + 'Left']();
                    }
                    if (['arrowright', 'd'].indexOf(e.key.toLowerCase()) >= 0) {
                        this[type + 'Right']();
                    }
                });

                this.mouseDownSubscription = this.mouseDown.subscribe((e) => {
                    soundFX.startBeam();
                    this.setStatus('firing', 'STREAM ACTIVE');
                    if (this.stream) this.stream.kill();
                    this.stream = new Stream(this.stage);
                    this.stream.setTarget(e);
                });

                this.mouseMoveSubscription = this.mouseMove.subscribe((e) => {
                    if (this.stream) this.stream.setTarget(e);
                    if (this.caughtGhost) this.caughtGhost.setTarget(e);
                });

                this.mouseUpSubscription = this.mouseUp.subscribe((e) => {
                    soundFX.stopBeam();
                    this.setStatus('ready', 'SYSTEM READY');
                    if (this.stream) this.stream.kill();
                    if (this.caughtGhost) this.caughtGhost.clearTarget();
                    this.caughtGhost = null;
                    this.previouslyHitGhost = null;
                    this.stream = null;
                });

                window.requestAnimationFrame((t) => {
                    this.tick(t);
                });
            }

            setPlayerDirection(direction, go = false) {
                if (go) this.playerTargetSpeed = direction;
                else if (this.playerTargetSpeed == direction)
                    this.playerTargetSpeed = 0;
            }

            end() {
                soundFX.stopBeam();
                if (this.keyPressSubscription)
                    this.keyPressSubscription.unsubscribe();
                if (this.mouseDownSubscription)
                    this.mouseDownSubscription.unsubscribe();
                if (this.mouseMoveSubscription)
                    this.mouseMoveSubscription.unsubscribe();
                if (this.mouseUpSubscription) this.mouseUpSubscription.unsubscribe();
            }

            tick(timestamp) {
                if (!this.startTimestamp) this.startTimestamp = timestamp;
                let progress = timestamp - this.startTimestamp;

                if (this.playerCurrentSpeed > this.playerTargetSpeed)
                    this.playerCurrentSpeed -= this.PLAYER_SPEED_STEP;
                if (this.playerCurrentSpeed < this.playerTargetSpeed)
                    this.playerCurrentSpeed += this.PLAYER_SPEED_STEP;

                let targetX = this.player.x + this.playerCurrentSpeed;
                let actualX = U.within(0, targetX, this.width - this.player.width);
                this.player.setX(actualX);

                if (this.stream) {
                    this.stream.setStart({
                        x: actualX + this.player.width / 2,
                        y: this.player.y + 10,
                    });
                }

                if (targetX != actualX) {
                    let bounceBackSpeed = this.playerCurrentSpeed / 2;
                    this.playerCurrentSpeed = Math.round(
                        bounceBackSpeed - bounceBackSpeed * 2
                    );
                }

                if (!this.caughtGhost && this.stream) {
                    for (let i = 0; i < this.ghosts.length; i++) {
                        let ghost = this.ghosts[i];
                        if (ghost.isHit({ x: this.stream.x, y: this.stream.y })) {
                            this.caughtGhost = ghost;
                            this.caughtGhost.setTarget({
                                x: this.stream.x,
                                y: this.stream.y,
                            });
                            if (this.previouslyHitGhost !== ghost) {
                                this.capturedTotal++;
                                this.updateCapturedCount();
                                soundFX.zap();
                                this.previouslyHitGhost = ghost;
                            }
                            this.setStatus('locked', 'GHOST LOCKED!');
                            break;
                        }
                    }
                }

                for (let i = 0; i < this.ghosts.length; i++) {
                    this.ghosts[i].draw();
                }

                if (this.caughtGhost && this.stream) {
                    this.stream.setSticky(
                        { x: this.caughtGhost.x, y: this.caughtGhost.y },
                        this.caughtGhost.radius
                    );
                }

                this.player.draw();
                if (this.stream) this.stream.draw();

                window.requestAnimationFrame((t) => {
                    this.tick(t);
                });
            }
        }

        // Procedural Ghost Entity
        class Ghost {
            constructor(svg, x = 0, y = 0) {
                this.lightningLines = [];
                this.x = 0;
                this.y = 0;
                this.count = 0;
                this.lerp = 20;
                this.boltCount = 4;
                this.boltRadius = 40;
                this.bodyPoints = [
                    { type: 'M', x: 50, y: 0 },
                    { type: 'Q', x: 100, y: 0 },
                    { x: 100, y: 50 },
                    { type: 'L', x: 100, y: 100 },
                    { x: 84, y: 90 },
                    { x: 68, y: 100 },
                    { x: 52, y: 90 },
                    { x: 36, y: 100 },
                    { x: 20, y: 90 },
                    { x: 0, y: 100 },
                    { x: 0, y: 50 },
                    { type: 'Q', x: 0, y: 0 },
                    { x: 50, y: 0 },
                ];
                this.eyePoints = [
                    { type: 'M', x: 10, y: 0 },
                    { type: 'Q', x: 20, y: 0 },
                    { x: 20, y: 10 },
                    { x: 20, y: 20 },
                    { x: 10, y: 20 },
                    { x: 0, y: 20 },
                    { x: 0, y: 10 },
                    { x: 0, y: 0 },
                    { x: 10, y: 0 },
                ];
                this.eyePointsShocked = [
                    { type: 'M', x: 15, y: 0 },
                    { type: 'Q', x: 30, y: 0 },
                    { x: 30, y: 15 },
                    { x: 30, y: 30 },
                    { x: 15, y: 30 },
                    { x: 0, y: 30 },
                    { x: 0, y: 15 },
                    { x: 0, y: 0 },
                    { x: 15, y: 0 },
                ];
                this.hitPoints = [
                    { type: 'M', x: 0, y: 0 },
                    { type: 'L', x: 100, y: 0 },
                    { x: 100, y: 100 },
                    { x: 0, y: 100 },
                ];
                let random = Math.round(Math.random() * 10);
                this.width = 44 + random;
                this.height = 60 + random;
                this.svg = svg;
                this.x = x;
                this.y = y;
                this.group = this.svg.group();
                this.count = Math.random() * 100;
                
                // Ghost body color variations
                const ghostHues = ['#E63946', '#CC0000', '#9B5DE5', '#F15BB5', '#E71D36'];
                const ghostColor = ghostHues[Math.floor(Math.random() * ghostHues.length)];
                
                this.body = this.group.path();
                this.body.attr({ fill: ghostColor, fillOpacity: 0.92 });
                this.rightEye = this.group.path();
                this.rightEye.attr({ fill: '#0a0d14' });
                this.leftEye = this.group.path();
                this.leftEye.attr({ fill: '#0a0d14' });
                this.blurLines = this.group.group();
                this.sharpLines = this.group.group();
                this.blurFilter = this.svg.filter(Snap.filter.blur(7, 7));
                this.blurLines.attr({ filter: this.blurFilter });
                
                for (let i = 0; i < this.boltCount; i++) {
                    let line = i % 2 == 0 ? this.sharpLines.path() : this.blurLines.path();
                    line.attr({
                        fill: 'none',
                        strokeLinecap: 'round',
                        strokeOpacity: i % 2 == 0 ? 0.8 : 1,
                    });
                    this.lightningLines.push(line);
                }
                
                this.hitPath = this.group.path();
                this.hitPath.attr({ fill: 'red', fillOpacity: 0 });
                this.draw();
            }

            isHit(point) {
                return Snap.path.isPointInside(
                    this.hitPath.attr('d'),
                    point.x,
                    point.y
                );
            }

            setTarget(position, streamStart) {
                this.target = position;
                this.streamStart = streamStart;
                this.setXYFromTarget();
            }

            clearTarget() {
                this.target = null;
            }

            setXYFromTarget() {
                this.x += (this.target.x - this.x) / this.lerp;
                this.y += (this.target.y - this.y) / this.lerp;
            }

            draw() {
                if (this.target) this.setXYFromTarget();
                if (!this.target) {
                    this.count += 0.08;
                    this.x += Math.sin(this.count * 0.5) * 1.2;
                    this.y += Math.cos(this.count * 0.2) * 0.9;
                }
                let _x = this.target ? this.x + U.randomFromRange(-3, 3) : this.x;
                let _y = this.target ? this.y + U.randomFromRange(-3, 3) : this.y;

                this.hitPath.attr({
                    d: U.createPath(
                        this.hitPoints,
                        { x: _x - this.width / 2, y: _y - this.height / 2 },
                        { width: this.width, height: this.height }
                    ),
                });
                this.body.attr({
                    d: U.createPath(
                        this.bodyPoints,
                        { x: _x - this.width / 2, y: _y - this.height / 2 },
                        { width: this.width, height: this.height }
                    ),
                });
                this.rightEye.attr({
                    d: U.createPath(
                        this.target ? this.eyePointsShocked : this.eyePoints,
                        { x: _x + this.width / 4 - 8, y: _y - this.height / 4 },
                        { width: this.width, height: this.height }
                    ),
                });
                this.leftEye.attr({
                    d: U.createPath(
                        this.target ? this.eyePointsShocked : this.eyePoints,
                        { x: _x - this.width / 4, y: _y - this.height / 4 },
                        { width: this.width, height: this.height }
                    ),
                });

                for (let i = 0; i < this.lightningLines.length; i++) {
                    let lineString = '';
                    if (this.target) {
                        let points = 18;
                        let randomOffset = 5;
                        for (let j = 0; j < points; j++) {
                            let x =
                                this.x +
                                U.randomFromRange(-randomOffset, randomOffset) +
                                this.boltRadius * Math.cos((2 * Math.PI * j) / points);
                            let y =
                                this.y +
                                U.randomFromRange(-randomOffset, randomOffset) +
                                this.boltRadius * Math.sin((2 * Math.PI * j) / points);
                            lineString += (j == 0 ? 'M ' : ' L ') + x + ' ' + y;
                        }
                        lineString += 'Z';
                    }
                    this.lightningLines[i].attr({
                        d: lineString,
                        stroke: U.colors[Math.floor(Math.random() * U.colors.length)],
                        strokeWidth: Math.random() * 3.5,
                    });
                }
            }
        }

        // Player / Containment Emitter
        class Player {
            constructor(svg) {
                this.speedChangeX = [0];
                this.x = 0;
                this.y = 0;
                this.width = 70;
                this.height = 45;
                this.setX = (newX) => {
                    this.speedChangeX.push(this.x - newX);
                    if (this.speedChangeX.length > 3) this.speedChangeX.shift();
                    this.x = newX;
                };
                this.setY = (newY) => (this.y = newY - this.height - 10);
                this.svg = svg;
                this.group = this.svg.group();

                // Sleek futuristic emitter base
                this.emitterBase = this.group.rect(10, 22, 50, 22, 6, 6).attr({
                    fill: '#151d2a',
                    stroke: '#507DBC',
                    strokeWidth: 2
                });

                // Proton barrel nozzle
                this.barrel = this.group.rect(26, 6, 18, 18, 4, 4).attr({
                    fill: '#1f2b3e',
                    stroke: '#69FFF1',
                    strokeWidth: 1.5
                });

                // Emitter Core Glow
                this.coreGlow = this.group.circle(35, 14, 5).attr({
                    fill: '#69FFF1',
                    fillOpacity: 0.8
                });
                this.core = this.group.circle(35, 14, 2.5).attr({
                    fill: '#ffffff'
                });
            }

            draw() {
                this.group.attr({ transform: U.translate(this.x, this.y) });
            }
        }

        // Proton Stream Lightning Effect
        class Stream {
            constructor(svg) {
                this.x = 0;
                this.y = 0;
                this.bX = 0;
                this.bY = 0;
                this.targetLerp = 40;
                this.bezierLerp = 6;
                this.lightningLines = [];
                this.count = 0;
                this.boltCount = 22;
                this.boltPointSpace = 10;
                this.svg = svg;
                this.group = this.svg.group();
                this.blurLines = this.group.group();
                this.sharpLines = this.group.group();
                this.blurFilter = this.svg.filter(Snap.filter.blur(7, 7));
                this.blurLines.attr({ filter: this.blurFilter });

                this.primaryLine = this.blurLines.path();
                this.primaryLine.attr({
                    fill: 'none',
                    stroke: '#0F5257',
                    strokeOpacity: 0.25,
                    strokeLinecap: 'round',
                    strokeWidth: 16,
                });

                this.targetBezierCircle = this.group.circle(-5, -5, 5).attr({ fill: '#69fff1' });
                this.targetCircle = this.group.circle(-5, -5, 6).attr({ fill: '#ff6978' });

                for (let i = 0; i < this.boltCount; i++) {
                    let line = i % 2 == 0 ? this.sharpLines.path() : this.blurLines.path();
                    line.attr({
                        fill: 'none',
                        strokeLinecap: 'round',
                        strokeOpacity: i % 2 == 0 ? 0.85 : 1,
                    });
                    this.lightningLines.push(line);
                }
            }

            setTarget(newTarget) {
                this.target = newTarget;
            }

            setStart(newStart) {
                this.start = newStart;
                if (!this.x || !this.y) {
                    this.x = this.bX = this.start.x;
                    this.y = this.bY = this.start.y;
                }
            }

            setSticky(newSticky) {
                this.sX = newSticky.x;
                this.sY = newSticky.y;
            }

            draw() {
                if (this.start && this.target) {
                    ++this.count;
                    this.targetLerp = this.targetLerp > 10 ? this.targetLerp - 3 : 10;
                    this.bezierLerp = this.bezierLerp > 1.5 ? this.bezierLerp - 0.2 : 1.5;

                    if (this.sX == null) {
                        this.x += (this.target.x - this.x) / this.targetLerp;
                        this.y += (this.target.y - this.y) / this.targetLerp;
                    } else {
                        this.x = this.sX;
                        this.y = this.sY;
                    }

                    this.bX +=
                        Math.sin(this.count * (this.sX ? 0.17 : 0.15)) *
                            (this.sX ? 30 : 40) +
                        (this.start.x +
                            (this.target.x - this.start.x) / this.bezierLerp -
                            this.bX);
                    this.bY +=
                        Math.cos(this.count * (this.sX ? 0.17 : 0.15)) *
                            (this.sX ? 30 : 40) +
                        (this.start.y +
                            (this.target.y - this.start.y) / this.bezierLerp -
                            this.bY);

                    let startString = 'M' + this.start.x + ' ' + this.start.y;
                    let bezierString = 'Q' + this.bX + ' ' + this.bY;
                    let targetString = ' ' + this.x + ' ' + this.y;
                    this.primaryLine.attr({
                        d: startString + bezierString + targetString,
                    });

                    let spaces = this.boltPointSpace;
                    let pointAt = 0;
                    let length = this.primaryLine.getTotalLength();
                    let points = [];
                    while (pointAt < length) {
                        pointAt += spaces;
                        points.push(this.primaryLine.getPointAtLength(pointAt));
                    }

                    for (let i = 0; i < this.lightningLines.length; i++) {
                        let lineString = 'M' + this.start.x + ' ' + this.start.y;
                        for (let j = 0; j < points.length; j++) {
                            let rand =
                                ((this.boltPointSpace + 5) / this.lightningLines.length) * i;
                            let x =
                                points[j].x +
                                Math.random() *
                                    Math.sin(this.count * j) *
                                    (rand - (rand / points.length) * j);
                            let y =
                                points[j].y +
                                Math.random() *
                                    Math.cos(this.count * j) *
                                    (rand - (rand / points.length) * j);
                            lineString += ' ' + x + ' ' + y;
                        }
                        this.lightningLines[i].attr({
                            d: lineString,
                            stroke: U.colors[Math.floor(Math.random() * U.colors.length)],
                            strokeWidth: Math.random() * (this.sX ? 3.5 : 1.2),
                        });
                    }
                }
            }

            kill() {
                let spaces = 50;
                let pointAt = 0;
                let length = this.primaryLine ? this.primaryLine.getTotalLength() : 0;
                let points = [];
                while (pointAt < length) {
                    pointAt += spaces;
                    points.push(this.primaryLine.getPointAtLength(pointAt));
                }
                if (this.primaryLine) {
                    this.primaryLine.animate({ strokeOpacity: 0, strokeWidth: 1 }, 1000);
                }
                setTimeout(() => {
                    if (this.group) this.group.remove();
                }, 1000);

                if (points.length) {
                    for (let i = 0; i < this.lightningLines.length; i++) {
                        let lineString = 'M' + this.start.x + ' ' + this.start.y;
                        for (let j = 0; j < points.length; j++) {
                            let rand = (100 / this.lightningLines.length) * i;
                            let x =
                                points[j].x +
                                Math.random() *
                                    Math.sin(this.count * j) *
                                    (rand - (rand / points.length) * j);
                            let y =
                                points[j].y +
                                Math.random() *
                                    Math.cos(this.count * j) *
                                    (rand - (rand / points.length) * j);
                            lineString += ' ' + x + ' ' + y;
                        }
                        this.lightningLines[i].animate(
                            { d: lineString, strokeOpacity: 0, strokeWidth: 1 },
                            500
                        );
                    }
                }
            }
        }

        // Initialize and launch game
        window.addEventListener('DOMContentLoaded', () => {
            const game = new Game();
            game.start();
        });
    </script>
</body>
